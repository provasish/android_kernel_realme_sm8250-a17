# SM8250 Ultra-High Refresh Rate Gaming (120 FPS+)
# Phase 4: Aggressive optimization for 120 FPS, 144 FPS, 165 FPS capable games
# For: COD Mobile, Genshin Impact, Fortnite, Apex Legends, PUBG New State

# ============================================================================
# CRITICAL: 120 FPS Frame Time Requirement
# ============================================================================
# 120 FPS = 8.33ms per frame
# 144 FPS = 6.94ms per frame
# 165 FPS = 6.06ms per frame
#
# Every ms counts! Reducing jitter is critical.
# ============================================================================

# ============================================================================
# CPU SCHEDULING: Ultra-Low Latency
# ============================================================================

# Aggressive latency optimization for frame-critical systems
kernel.sched_latency_ns = 4000000      # 4ms (vs default 24ms) - CRITICAL
kernel.sched_min_granularity_ns = 1000000     # 1ms
kernel.sched_wakeup_granularity_ns = 1000000  # 1ms

# Increase number of tasks to migrate per load balance
kernel.sched_nr_migrate = 512           # More threads move between cores

# Reduce task migration cost threshold (more aggressive migrations)
kernel.sched_migration_cost_ns = 1000000      # 1ms - aggressive

# Disable child runs first (prioritize high-priority game threads)
kernel.sched_child_runs_first = 0

# Cache line size optimization for better cache hits
kernel.sched_cache_hot_buddy = 1

# ============================================================================
# CPU BOOST & FREQUENCY: Maximum Performance
# ============================================================================

# Keep CPU boost always enabled
kernel.cpufreq.boost = 1

# Aggressive frequency scaling
# No conservative transitions, immediate boost
kernel.sched_freq_scale = 1

# Reduce frequency scaling delay
# Process wakeup goes to max frequency immediately
kernel.sched_freq_avg_scale_up = 1

# ============================================================================
# MEMORY: Minimal Swap, Maximum Speed
# ============================================================================

# CRITICAL: Minimize swapping (swap = frame drops)
vm.swappiness = 5                # Ultra-low (vs Phase 1: 10)

# Aggressive dirty page flushing (prevents I/O stalls)
vm.dirty_ratio = 5               # Flush at 5% (vs Phase 1: 10)
vm.dirty_background_ratio = 2    # Background flush at 2%

# VERY FAST writeback
vm.dirty_writeback_centisecs = 25       # Flush every 250ms (vs Phase 1: 100ms)
vm.dirty_expire_centisecs = 25          # Expire pages in 250ms

# Increase page cache availability
vm.min_free_kbytes = 102400             # 100MB reserve (vs Phase 1: 51MB)

# No memory pressure from other processes
vm.extra_free_kbytes = 51200            # 50MB extra reserve

# Zero page cache pressure during gaming
vm.vfs_cache_pressure = 10              # Minimal cache recycling

# Disable memory compaction (causes latency)
vm.compaction_proactiveness = 0

# ============================================================================
# I/O: Maximum Throughput with Minimal Latency
# ============================================================================

# Kyber scheduler with aggressive tuning (Phase 3 already enabled)
# No additional tuning needed - Kyber is already optimal

# Read-ahead optimization for asset loading
vm.readahead_kb = 512                   # Aggressive pre-reading

# Increase I/O queue depth for better parallelism
kernel.sched_io_rw_load_boost = 1

# ============================================================================
# NETWORK: Lowest Latency for Online Gaming
# ============================================================================

# TCP optimization for competitive play
net.ipv4.tcp_nodelay = 1                # No Nagle's algorithm
net.ipv4.tcp_low_latency = 1            # Ultra-low latency TCP
net.ipv4.tcp_sack = 1                   # Selective ACK for efficiency

# Increase socket buffer for better network handling
net.core.rmem_max = 268435456           # 256 MB read buffer
net.core.wmem_max = 268435456           # 256 MB write buffer
net.core.rmem_default = 134217728       # 128 MB default
net.core.wmem_default = 134217728       # 128 MB default

# Socket queue optimization
net.core.netdev_max_backlog = 5000      # Higher network queue

# TCP buffer tuning for sustained throughput
net.ipv4.tcp_rmem = "4096 87380 67108864"    # 64 MB max
net.ipv4.tcp_wmem = "4096 65536 67108864"    # 64 MB max

# Fast connection reuse
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10

# ============================================================================
# DISPLAY/VSYNC: Frame Synchronization Optimization
# ============================================================================

# Reduce display latency for smoother 120 FPS
# (These would be set via GPU driver interface in production)
#
# Concept: Each frame should sync with display refresh to prevent tearing
# At 120 FPS: 8.33ms per frame, must maintain exactly
# Vsync should be ENABLED for 120 FPS (prevents tearing)

# ============================================================================
# POWER MANAGEMENT: Disable Idle States During Gaming
# ============================================================================

# No C-states (idle power saving) during active gaming
# Reduces latency from exit of idle state
kernel.timer_migration = 0              # No timer migration between cores

# RCU optimization for low latency
kernel.rcu_nocb_poll = 1                # Polling mode, no callbacks delaying

# ============================================================================
# CGROUP V2: Game Process Isolation (Phase 3 compatible)
# ============================================================================

# Ensure game process gets maximum resources
# cpu.max = "950000 1000000"             # 95% of CPU (leave 5% for system)
# memory.max = "0"                       # No hard limit, use soft limits

# ============================================================================
# PROCESS PRIORITY: Maximum Game Thread Priority
# ============================================================================

# These are applied by Game Mode Scheduler (Phase 3)
# Process priority boost: -15 (max user-space priority)
# Game threads get CPU time before background tasks

# ============================================================================
# THERMAL: AGGRESSIVE FOR 120 FPS
# ============================================================================

# 120 FPS requires sustained high performance
# Use AGGRESSIVE thermal profile
kernel.thermal.trip_type = 90000        # 90°C threshold (vs 85°C for 60 FPS)

# Note: This is for short bursts (ranked matches, events)
# For sustained 120 FPS, use 85°C profile and ensure cooling

# ============================================================================
# TOUCH LATENCY: Ultra-critical for 120 FPS
# ============================================================================

# Touch input must respond in < 8.33ms (1 frame at 120 FPS)
# Already optimized in Phase 2 (doubled buffers)
# These additional parameters fine-tune touch handling

# Increase input wakeup priority
# (Set via input driver - gamemode.c handles this)

# ============================================================================
# FRAME PACING: 120 FPS Lock
# ============================================================================

# To maintain steady 120 FPS:
# - CPU must finish frame in <= 8.33ms
# - GPU must finish rendering in <= 8.33ms
# - Display refresh must be synchronized
# - No stalls allowed

# Kernel parameter: reduce jitter to < 1ms
kernel.sched_latency_ns = 4000000       # 4ms latency

# ============================================================================
# VALIDATION: Check 120 FPS Settings
# ============================================================================

# Monitor in-game:
# watch -n 1 'cat /proc/cpuinfo | grep MHz'
# Expected: All cores near max (2.8 GHz for Gold, 1.8 GHz for Silver)

# Check thermal:
# watch -n 1 'cat /sys/class/thermal/thermal_zone*/temp'
# Expected: 85-90°C during intensive gaming

# Check FPS consistency:
# Use in-game FPS counter
# 120 FPS should show < 5% frame time variance

# ============================================================================
# ADVANCED: Per-Game 120 FPS Settings
# ============================================================================

# COD Mobile (GPU-heavy):
# - Use aggressive thermal (90°C)
# - Boost GPU frequency to max
# - Reduce CPU frequency scaling delay

# Genshin Impact (CPU+GPU balanced):
# - Use balanced thermal (85°C)
# - Distribute load across cores
# - Monitor temperatures closely

# PUBG New State (high resolution):
# - Use conservative (82°C) for sustained play
# - Enable aggressive memory writeback
# - Boost I/O for asset streaming

# ============================================================================
# IMPORTANT: Hardware Limits
# ============================================================================

# SM8250 @ 120 FPS specs:
# - GPU: A650 @ 900 MHz (max)
# - CPU Gold: 2.8 GHz (max)
# - CPU Silver: 1.8 GHz (max)
# - RAM: 6-12 GB (depends on device)
#
# These limits are HARDWARE LIMITS, cannot be exceeded safely
# Optimization = getting GPU/CPU to these limits CONSISTENTLY

# ============================================================================
# ANTI-THROTTLING: 120 FPS Requires Sustained Max Frequency
# ============================================================================

# Thermal throttling is the #1 enemy of 120 FPS
# Every thermal throttle = frame drops
#
# Solution:
# 1. Good device cooling (case off, well-ventilated area)
# 2. Aggressive thermal threshold (85-90°C)
# 3. Fast frequency scaling (already optimized)
# 4. Thermal-aware game scheduling (Phase 3)

# ============================================================================
