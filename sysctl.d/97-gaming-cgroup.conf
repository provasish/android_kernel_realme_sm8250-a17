# Gaming Process Control Groups (cgroups v2)
# Advanced resource management for game processes
# Phase 3: Game-aware cgroup scheduling

# CPU Controller: Allocate more CPU quota to game processes
# Game processes get 80% of total CPU time
# Background processes get 20%
cpu.max = "800000 1000000"

# Memory Controller: Prevent game OOM kills
# Allow games to use up to 85% of available RAM
memory.max = "0"  # No hard limit, relies on soft limits below
memory.high = "0" # Set dynamically based on device RAM

# I/O Controller: Priority for game I/O operations
# Higher priority = lower latency I/O
io.prio.class = "rt"  # Real-time I/O priority

# Process Priority (nice values)
# Game threads: -10 (higher priority)
# Background: +10 (lower priority)

# CPU Affinity for game threads
# Performance cores only: CPU 6-7 (Gold cluster)
cpuset.cpus = "6,7"
cpuset.mems = "0"

# Prevent memory swapping for game processes
memory.swappiness = 0

# CPU cycles distribution
# Use deadline scheduler for predictable performance
cpu.deadline_us = "1000000"
cpu.period_us = "1000000"
cpu.runtime_us = "800000"

# Freezer: Pause non-game processes
# Prevents background tasks from interrupting gameplay
freezer.state = "THAWED"

# Process accounting: Track game resource usage
#processacct.enabled = 1

# Per-core CPU assignment
# Game main thread: core 7 (fastest)
# Render thread: core 6
# Network thread: core 5
# Physics thread: core 4
