# Advanced Gaming Scheduler Optimization
# Phase 2: Medium-impact tuning for competitive gaming

# CPU Scheduler Optimization
# Reduce scheduling latency for game threads
kernel.sched_latency_ns = 6000000
kernel.sched_min_granularity_ns = 1500000
kernel.sched_wakeup_granularity_ns = 2000000

# Increase preemption frequency for responsive feel
kernel.sched_nr_migrate = 256

# Reduce child weight to prioritize foreground app
kernel.sched_child_runs_first = 1

# Task migration optimization
kernel.sched_migration_cost_ns = 3000000

# Disable autogroup to prevent gaming threads from being grouped
kernel.sched_autogroup_enabled = 0

# RCU optimization for low latency
kernel.rcu_nocb_poll = 0

# I/O Tuning
# Reduce I/O blocking time
kernel.io_uring_sqpoll_cpu = 0

# VM Writeback aggressive tuning
vm.dirty_writeback_centisecs = 50
vm.dirty_expire_centisecs = 50

# Transparent Hugepage tuning for gaming workloads
vm.transparent_hugepage = always

# Zone reclaim disabled for better performance
vm.zone_reclaim_mode = 0

# Read-ahead optimization (tuned for gaming assets)
vm.readahead_kb = 256

# Reduce CPU power management overhead
kernel.timer_migration = 0

# Disable CPU idle to prevent frequency transitions
# (Can be done per-core via cpuidle sysfs if needed)
# kernel.cpuidle.off = 1

# Network optimization for online gaming
net.ipv4.tcp_nodelay = 1
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_sack = 1

# Increase TCP socket buffer
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728

# Game-specific: reduce system jitter
kernel.sched_migration_cost_ns = 2000000
kernel.sched_latency_ns = 5000000
