# Dynamic Thermal Profiles for Gaming
# Phase 3: Per-game thermal management

# ============================================================================
# PROFILE 1: DEFAULT GAMING PROFILE (BGMI/PUBG)
# ============================================================================
# Conservative: 85°C threshold for sustained gaming (1+ hour)
thermal_zone_trip_type=85000

# ============================================================================
# PROFILE 2: HIGH-PERFORMANCE PROFILE (Competitive)
# ============================================================================
# Aggressive: 90°C threshold for short bursts (15-30 min ranked)
# Uncomment when playing ranked/competitive
# thermal_zone_trip_type=90000

# ============================================================================
# PROFILE 3: BALANCED PROFILE
# ============================================================================
# Medium: 82°C threshold for balanced temp/perf
# thermal_zone_trip_type=82000

# ============================================================================
# Thermal Throttling Strategy
# ============================================================================

# CPU Thermal Throttling
# - Thermal trip point: Based on profile above
# - Cooling: Frequency scaling (aggressive DVFS)
# - Notification: At 75°C (before throttling)

# GPU Thermal Throttling
# - GPU trip: 82°C (lower than CPU to protect)
# - Cooling: GPU frequency scaling
# - Fan: Maximum if available

# Skin Temperature
# - Back panel temp: Max 45°C for user comfort
# - Throttling: Moderate all clocks if exceeded

# ============================================================================
# Thermal Monitoring
# ============================================================================

# Check thermal zones
# cat /sys/class/thermal/thermal_zone*/temp
# cat /sys/class/thermal/thermal_zone*/trip_point_*/temp

# Monitor CPU/GPU frequency during gaming
# watch -n 1 'grep MHz /proc/cpuinfo && cat /sys/kernel/debug/clk/gcc_gpu_clk/measure'

# ============================================================================
# Quick Profile Switch Commands
# ============================================================================

# Competitive Mode (Allow higher temps)
# echo 90000 > /sys/class/thermal/thermal_zone0/trip_point_0_temp

# Balanced Mode
# echo 82000 > /sys/class/thermal/thermal_zone0/trip_point_0_temp

# Conservative Mode (Low temps)
# echo 75000 > /sys/class/thermal/thermal_zone0/trip_point_0_temp

# ============================================================================
# Auto-Profile Based on Game Detected
# ============================================================================
# gaming-monitor.sh will automatically switch profiles:
# - PUBG Mobile: Balanced (82°C)
# - BGMI: Conservative (85°C) - heavier on GPU
# - COD Mobile: Competitive (88°C)
# - Asphalt 9: High-Performance (90°C)
# - Genshin Impact: Conservative (80°C) - sustained load

# ============================================================================
# Temperature-Based Frequency Scaling
# ============================================================================

# At 75°C: Mild frequency reduction (90% max)
# At 80°C: Moderate reduction (80% max)
# At 85°C: Significant reduction (70% max)
# At 90°C: Heavy throttling (50% max)
# At 95°C: Critical - emergency thermal shutdown

# Hysteresis: 5°C gap between throttle-down and throttle-up
# Example: If throttle at 85°C, unthrottle at 80°C

# ============================================================================
# Thermal Management Best Practices
# ============================================================================

# 1. Ensure good airflow around device during gaming
# 2. Remove phone case for better cooling
# 3. Use game launcher's cooling features if available
# 4. Enable GPU overdrive sparingly (Phase 2 only)
# 5. Monitor temperatures during extended sessions

# Default: Apply PROFILE 1 (BGMI/PUBG Conservative)
# Users can manually switch profiles via sysfs
