# Gaming Performance Optimization Sysctl Settings
# For use on SM8250 devices running BGMI, PUBG, and other high-performance games
# This configuration minimizes latency and maintains peak performance

# Memory Management for Gaming
# Reduce swappiness to keep game data in RAM
vm.swappiness = 10

# Increase dirty page ratio threshold to reduce I/O stalls
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Faster dirty page writeback
vm.dirty_writeback_centisecs = 100
vm.dirty_expire_centisecs = 100

# Increase free memory reserve for game allocations
vm.min_free_kbytes = 51200

# Page cache optimization
# Reduce page cache pressure during gaming
vm.vfs_cache_pressure = 30

# Enable memory compaction for better fragmentation handling
vm.compact_memory = 0

# I/O Optimization
# Reduce disk I/O blocking
kernel.sched_migration_cost_ns = 5000000

# Network stack optimization
# Reduce network latency for online games
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Scheduler optimization
# Reduce scheduling latency for game threads
kernel.sched_latency_ns = 8000000
kernel.sched_min_granularity_ns = 2000000

# CPU Boost
# Ensure CPU boost is enabled
kernel.cpufreq.boost = 1

# Process priority
# Allow real-time scheduling for game threads (if needed by launcher)
kernel.sched_rt_period_us = 1000000
kernel.sched_rt_runtime_us = 950000
